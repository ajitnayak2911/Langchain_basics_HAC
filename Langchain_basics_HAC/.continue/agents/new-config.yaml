
name: Ajit Local AI Models
version: 1.0.0
schema: v1

models:
  - name: Qwen3 Coder 32K
    provider: ollama
    model: "qwen3-coder-32k:latest"
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply

  - name: Qwen3 Coder
    provider: ollama
    model: "qwen3-coder:latest"
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use  

  - name: Qwen3 8B
    provider: ollama
    model: "qwen3:8b"
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply

  - name: Qwen3 4B
    provider: ollama
    model: "qwen3:4b"
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply

  - name: Qwen3 4B Autocomplete
    provider: ollama
    model: "qwen3:4b"
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    requestOptions:
      extraBodyProperties:
        think: false
